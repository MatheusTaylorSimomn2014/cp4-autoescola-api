# =========================================
# AutoEscola API - configuracao principal
# =========================================
spring.application.name=autoescola-api

# --- Banco de dados (dev: H2 em memoria) ---
spring.datasource.url=jdbc:h2:mem:autoescola;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI (documentacao automatica) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# --- Integracao externa: ViaCEP ---
app.api.viacep.base-url=https://viacep.com.br/ws

# --- Regras de negocio configuraveis ---
app.regra.limite-cancelamentos=3

# --- CORS (origens permitidas para o frontend) ---
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# --- Serializacao de datas ---
spring.jackson.serialization.write-dates-as-timestamps=false
