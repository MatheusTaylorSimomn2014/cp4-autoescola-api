# Testes: banco em memoria dedicado
spring.datasource.url=jdbc:h2:mem:autoescola-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# URL "fake" para o ViaCEP: testes de integracao nao devem sair da rede.
# O endpoint /api/cep e testado com MockRestServiceServer no teste do client.
app.api.viacep.base-url=http://localhost:9999/ws

app.regra.limite-cancelamentos=3
spring.main.banner-mode=off
